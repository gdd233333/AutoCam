name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema tools
        run: python -m pip install -r contracts/tools/requirements.txt
      - name: Validate contracts
        run: python contracts/tools/validate.py
