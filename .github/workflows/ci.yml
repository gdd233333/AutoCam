name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema tools
        run: python -m pip install -r contracts/tools/requirements.txt
      - name: Validate contracts
        run: python contracts/tools/validate.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: JVM golden tests
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host googletest (autocam::add)
        run: |
          cmake -S shared/core-cpp -B build/core-cpp -DAUTOCAM_BUILD_TESTS=ON -DAUTOCAM_BUILD_JNI=OFF
          cmake --build build/core-cpp
          ctest --test-dir build/core-cpp --output-on-failure

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Student unit tests
        run: |
          python -m pip install -r ml/requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest ml/tests -q
      - name: Random-weight export whitelist
        run: |
          python -m pip install -r ml/requirements-export.txt
          python ml/export/random_weight_export_ci.py

